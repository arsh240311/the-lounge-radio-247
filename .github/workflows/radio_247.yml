name: The Lounge 24/7 Tamil Stage Radio

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '25 */5 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: lounge-radio-247-stream
  cancel-in-progress: true

jobs:
  stream_radio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libopus0 libsodium23
          python3 -m pip install --upgrade pip
          python3 -m pip install -U "discord.py[voice]" PyNaCl yt-dlp requests

      - name: Run 24/7 Stage Radio Stream (DJ DUDE official)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          MAX_RUNTIME_SEC: "19200"
        run: |
          python3 -u cloud_bot.py

      - name: Auto-Relay Next 24/7 Runner Leg
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run radio_247.yml --ref main || true
